name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.galtibook.app --project-name galtibook .

      - name: Enable core library desugaring for Android
        run: |
          python3 - <<'EOF'
          import os, re, sys

          candidates = [
              "android/app/build.gradle.kts",
              "android/app/build.gradle",
          ]
          path = next((p for p in candidates if os.path.exists(p)), None)
          if path is None:
              sys.exit(1)

          with open(path, "r", encoding="utf-8") as f:
              src = f.read()

          if "desugar_jdk_libs" not in src:
              is_kts = path.endswith(".kts")
              enable_line = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
              dep_line = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if is_kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

              src, n1 = re.subn(r"(compileOptions\s*\{)", r"\1\n        " + enable_line, src, count=1)
              if n1 == 0:
                  sys.exit(1)

              if re.search(r"dependencies\s*\{", src):
                  src = re.sub(r"(dependencies\s*\{)", r"\1\n    " + dep_line, src, count=1)
              else:
                  src = src.rstrip() + f"\n\ndependencies {{\n    {dep_line}\n}}\n"

              with open(path, "w", encoding="utf-8") as f:
                  f.write(src)
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: galtibook-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          
